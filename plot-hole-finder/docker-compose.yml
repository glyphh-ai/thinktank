# Local prod-like stack: API + worker + Postgres/pgvector + Redis.
#
#   docker compose up --build
#
# Secrets/overrides come from environment or a .env file in this directory
# (e.g. LLM_BACKEND=claude and ANTHROPIC_API_KEY=... to enable real extraction).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plothole
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plothole"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment: &app_env
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/plothole
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      BLOB_BACKEND: local
      BLOB_LOCAL_ROOT: /data/blobs
      EMAIL_BACKEND: console
      EMBED_BACKEND: hash
      LLM_BACKEND: ${LLM_BACKEND:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BILLING_BACKEND: disabled
      JOB_RUNNER: external          # the worker service runs jobs
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: ["blobs:/data/blobs"]

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *app_env           # same config as the API
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["blobs:/data/blobs"]  # shares local blobs with the API (use R2 in prod)

volumes:
  pgdata:
  blobs:
